<article (click)="onCardClick()" class="border border-gray-200 rounded-lg overflow-hidden bg-white hover:shadow-md transition-shadow cursor-pointer">
  <div class="aspect-square bg-gray-100 flex items-center justify-center">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="text-gray-300">
      <rect x="3" y="3" width="18" height="18" rx="2"/>
      <circle cx="9" cy="9" r="2"/>
      <path d="m21 15-5-5L5 21"/>
    </svg>
  </div>

  <div class="p-3 flex flex-col gap-2">
    <div>
      <p class="text-xs text-gray-500">{{ variant().product.productName }}</p>
      <p class="text-sm text-gray-900 font-medium leading-snug mt-0.5">{{ variant().variantName }}</p>
    </div>

    <div class="flex items-center gap-0.5">
      @for (star of starIndices; track star) {
        <svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          [attr.fill]="star <= variant().starRating ? '#f59e0b' : 'none'"
          stroke="#f59e0b"
          stroke-width="1.5"
          stroke-linejoin="round"
        >
          <polygon points="12 2 15.09 8.63 22 9.24 16.5 13.97 18.18 21 12 17.27 5.82 21 7.5 13.97 2 9.24 8.91 8.63 12 2"/>
        </svg>
      }
    </div>

    <p class="text-base font-semibold text-gray-900">{{ variant().price }} Lei</p>

    <button
      type="button"
      (click)="$event.stopPropagation()"
      class="min-h-11 flex items-center justify-center gap-2 bg-violet-600 hover:bg-violet-700 active:scale-95 text-white text-sm font-medium rounded-md transition-all"
    >
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="21" r="1"/>
        <circle cx="20" cy="21" r="1"/>
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
      </svg>
      Adauga in Cos
    </button>
  </div>
</article>

<div class="min-w-0 border border-gray-200 rounded-xl bg-white p-6">
  <h1 class="text-lg font-semibold text-gray-900 mb-4">Cosul tau</h1>

  @if (cartStore.items().length > 0) {
    <div class="divide-y divide-gray-100">
      @for (item of cartStore.items(); track item.id) {
        <div class="flex items-start justify-between gap-4 py-4 rounded-md -mx-1.5 px-1.5 has-[:hover]:bg-gray-50 transition-colors">
          <div class="flex-1 min-w-0 flex items-start gap-3">
            <button
              type="button"
              (click)="onItemClick(item)"
              class="w-16 h-16 shrink-0 rounded-md bg-gray-100 flex items-center justify-center overflow-hidden"
            >
              @if (item.variant.images.length > 0) {
                <img [src]="item.variant.images[0].thumbnailUrl" [alt]="item.variant.variantName" class="w-full h-full object-cover" />
              } @else {
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="text-gray-300">
                  <rect x="3" y="3" width="18" height="18" rx="2"/>
                  <circle cx="9" cy="9" r="2"/>
                  <path d="m21 15-5-5L5 21"/>
                </svg>
              }
            </button>
            <div class="flex-1 min-w-0">
              <button type="button" (click)="onItemClick(item)" class="text-left w-full">
                <p class="text-sm text-gray-900 font-medium">{{ item.variant.variantName }}</p>
                @if (item.variant.variantProperties.length > 0) {
                  <p class="text-xs text-gray-500 mt-0.5">{{ variantPropertiesLabel(item) }}</p>
                }
              </button>
              <div class="flex items-center gap-2 mt-2">
                <button type="button" (click)="onDecrement(item)" class="w-8 h-8 flex items-center justify-center border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50 active:scale-95 transition-all">-</button>
                <span class="w-6 text-center text-sm text-gray-900">{{ item.quantity }}</span>
                <button type="button" (click)="onIncrement(item)" class="w-8 h-8 flex items-center justify-center border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50 active:scale-95 transition-all">+</button>
              </div>
            </div>
          </div>

          <div class="flex flex-col items-end gap-2 shrink-0">
            <p class="text-sm font-semibold text-gray-900">{{ item.variant.price * item.quantity }} Lei</p>
            <button type="button" (click)="onRemove(item)" aria-label="remove-item" class="p-2 rounded-full hover:bg-gray-50 active:scale-95 transition-all text-gray-400 hover:text-red-600">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"/>
                <line x1="6" y1="6" x2="18" y2="18"/>
              </svg>
            </button>
          </div>
        </div>
      }
    </div>

    <div class="flex items-center justify-between pt-4 mt-4 border-t border-gray-200">
      <p class="text-sm text-gray-500">Subtotal</p>
      <p class="text-lg font-bold text-gray-900">{{ cartStore.subtotal() }} Lei</p>
    </div>

    <a
      routerLink="/checkout"
      class="mt-4 min-h-11 flex items-center justify-center bg-violet-600 hover:bg-violet-700 active:scale-95 transition-all rounded-md text-sm font-medium text-white"
    >
      Finalizeaza comanda
    </a>
  } @else {
    <p class="text-sm text-gray-500">Cosul tau este gol.</p>
  }
</div>
